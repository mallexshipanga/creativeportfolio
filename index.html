<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #controls {
    position: fixed; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 16px;
    font-family: sans-serif; color: #fff;
  }
  #controls button {
    background: rgba(0,0,0,.5); color: #fff; border: 1px solid #fff;
    padding: 8px 14px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <button id="prev">Prev</button>
  <span id="count"></span>
  <button id="next">Next</button>
</div>

<script>
  // List your PDFs here, in order. Put the files in a /photos folder.
  const photos = [
    "photos/01.pdf",
    "photos/02.pdf",
    "photos/03.pdf",
  ];

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";

  const canvas = document.getElementById('canvas');
  const count = document.getElementById('count');
  let current = 0;

  async function render(index) {
    const doc = await pdfjsLib.getDocument(photos[index]).promise;
    const page = await doc.getPage(1);

    const base = page.getViewport({ scale: 1 });
    const scale = Math.max(window.innerWidth / base.width, window.innerHeight / base.height);
    const viewport = page.getViewport({ scale });

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ctx = canvas.getContext('2d');
    const offsetX = (canvas.width - viewport.width) / 2;
    const offsetY = (canvas.height - viewport.height) / 2;

    ctx.setTransform(1, 0, 0, 1, offsetX, offsetY);
    await page.render({ canvasContext: ctx, viewport }).promise;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    count.textContent = (index + 1) + " / " + photos.length;
  }

  document.getElementById('prev').addEventListener('click', () => {
    current = (current - 1 + photos.length) % photos.length;
    render(current);
  });
  document.getElementById('next').addEventListener('click', () => {
    current = (current + 1) % photos.length;
    render(current);
  });
  window.addEventListener('resize', () => render(current));

  render(current);
</script>
</body>
</html>
