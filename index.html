<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ranchers:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <div class="card">
    <button id="prev">Prev</button>
    <span id="count"></span>
    <button id="next">Next</button>
  </div>
</div>

<section id="projects">
  <h2>Projects</h2>
  <div id="projectList"></div>
</section>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";

  const canvas = document.getElementById('canvas');
  const count = document.getElementById('count');
  const projectList = document.getElementById('projectList');
  let photos = [];
  let current = 0;

  async function render(index) {
    if (!photos.length) return;
    const doc = await pdfjsLib.getDocument(photos[index]).promise;
    const page = await doc.getPage(1);

    const base = page.getViewport({ scale: 1 });
    const scale = Math.max(window.innerWidth / base.width, window.innerHeight / base.height);
    const viewport = page.getViewport({ scale });

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ctx = canvas.getContext('2d');
    const offsetX = (canvas.width - viewport.width) / 2;
    const offsetY = (canvas.height - viewport.height) / 2;

    ctx.setTransform(1, 0, 0, 1, offsetX, offsetY);
    await page.render({ canvasContext: ctx, viewport }).promise;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    count.textContent = (index + 1) + " / " + photos.length;
  }

  function renderProjects(projects) {
    projectList.innerHTML = '';
    projects.forEach((p) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <div class="viewer">
          <iframe src="${p.file}" title="${p.title}"></iframe>
        </div>
        <div class="description">
          <h3>${p.title}</h3>
          <p>${p.description}</p>
        </div>
      `;
      projectList.appendChild(card);
    });
  }

  document.getElementById('prev').addEventListener('click', () => {
    current = (current - 1 + photos.length) % photos.length;
    render(current);
  });
  document.getElementById('next').addEventListener('click', () => {
    current = (current + 1) % photos.length;
    render(current);
  });
  window.addEventListener('resize', () => render(current));

  // Load the PDF list from creativeprojects.json — add new PDFs there,
  // not in this script.
  fetch('creativeprojects.json')
    .then((res) => res.json())
    .then((data) => {
      photos = data.slideshow || [];
      render(current);
      renderProjects(data.projects || []);
    });
</script>
</body>
</html>
