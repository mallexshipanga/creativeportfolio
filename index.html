<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Portfolio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lemonada:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <div class="card">
    <button id="prev">Prev</button>
    <span id="count"></span>
    <button id="next">Next</button>
  </div>
</div>

<section id="projects">
  <h2>Projects</h2>
  <div class="project-card">
    <div class="viewer">
      <iframe src="creativeprojects/campus-couture.pdf" title="Campus Couture photo essay"></iframe>
    </div>
    <div class="description">
      <h3>Campus Couture: Thematic Photoessay on Student Fashion</h3>

      <p>
        This is a thematic photoessay I created in 2025. The thematic photoessay 
        features three diverse university students’ fashion, exploring how each
        student uses clothing to express who they are.
      </p>
    </div>
  </div>
</section>

<script>
  // List your PDFs here, in order. Put the files in a /creativeprojects folder.
  const photos = [
    "creativeprojects/01.pdf",
    "creativeprojects/02.pdf",
    "creativeprojects/03.pdf",
  ];

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";

  const canvas = document.getElementById('canvas');
  const count = document.getElementById('count');
  let current = 0;

  async function render(index) {
    const doc = await pdfjsLib.getDocument(photos[index]).promise;
    const page = await doc.getPage(1);

    const base = page.getViewport({ scale: 1 });
    const scale = Math.max(window.innerWidth / base.width, window.innerHeight / base.height);
    const viewport = page.getViewport({ scale });

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ctx = canvas.getContext('2d');
    const offsetX = (canvas.width - viewport.width) / 2;
    const offsetY = (canvas.height - viewport.height) / 2;

    ctx.setTransform(1, 0, 0, 1, offsetX, offsetY);
    await page.render({ canvasContext: ctx, viewport }).promise;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    count.textContent = (index + 1) + " / " + photos.length;
  }

  document.getElementById('prev').addEventListener('click', () => {
    current = (current - 1 + photos.length) % photos.length;
    render(current);
  });
  document.getElementById('next').addEventListener('click', () => {
    current = (current + 1) % photos.length;
    render(current);
  });
  window.addEventListener('resize', () => render(current));

  render(current);
</script>
</body>
</html>
