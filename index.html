<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CREATIVE PORTFOLIO</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="content-wrapper">
  <section id="about-card" class="black-card">
    <img src="https://github.com/mallexshipanga.png" id="profile-pic" alt="Mallex Shipanga">
    <div class="about-text">
      <h1>ABOUT ME</h1>
      <p>I am a creative, media student, and saleswoman with experience in the communication and sales industries. Each of my creative projects uses photography, videography, and/or writing because I feel like communication is the bridge between an idea and a community.</p>
    </div>
  </section>

  <section id="projects">
    <h2>CREATIVE PROJECTS</h2>
    <div id="projectList"></div>
  </section>
</main>

<section id="stage-container">
  <div id="stage">
    <canvas id="canvas"></canvas>
    
    <div id="controls">
      <button id="prev">Prev</button>
      <span id="count"></span>
      <button id="next">Next</button>
    </div>
  </div>
</section>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js";

  const canvas = document.getElementById('canvas');
  const count = document.getElementById('count');
  const projectList = document.getElementById('projectList');
  
  let photos = [
    "creativeprojects/01.pdf",
    "creativeprojects/02.pdf",
    "creativeprojects/03.pdf"
  ];
  let current = 0;

  const defaultProjects = [
    {
      "file": "creativeprojects/Campus Couture.pdf",
      "title": "Campus Couture: Thematic Photoessay on Student Fashion",
      "description": "This is a thematic photoessay I created in 2025. The thematic photoessay features three diverse university students’ fashion, exploring how each student uses clothing to express who they are."
    },
    {
      "file": "creativeprojects/Sunflowers.pdf",
      "title": "Sunflowers",
      "description": "This is a photoshoot I captured and edited in August, 2026. The photoshoot prominently features sunflowers to encapsulate both creativity and youth."
    }
  ];

  async function render(index) {
    if (!photos.length) return;
    const doc = await pdfjsLib.getDocument(photos[index]).promise;
    const page = await doc.getPage(1);

    const base = page.getViewport({ scale: 1 });
    const scale = Math.max(canvas.parentElement.clientWidth / base.width, canvas.parentElement.clientHeight / base.height);
    const viewport = page.getViewport({ scale });

    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;

    const ctx = canvas.getContext('2d');
    const offsetX = (canvas.width - viewport.width) / 2;
    const offsetY = (canvas.height - viewport.height) / 2;

    ctx.setTransform(1, 0, 0, 1, offsetX, offsetY);
    await page.render({ canvasContext: ctx, viewport }).promise;
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    count.textContent = (index + 1) + " / " + photos.length;
  }

  function renderProjects(projects) {
    projectList.innerHTML = '';
    projects.forEach((p) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <div class="viewer">
          <iframe src="${p.file}#view=FitH" title="${p.title}"></iframe>
        </div>
        <div class="description">
          <h3>${p.title}</h3>
          <p>${p.description}</p>
        </div>
      `;
      projectList.appendChild(card);
    });
  }

  document.getElementById('prev').addEventListener('click', () => {
    current = (current - 1 + photos.length) % photos.length;
    render(current);
  });
  
  document.getElementById('next').addEventListener('click', () => {
    current = (current + 1) % photos.length;
    render(current);
  });
  
  window.addEventListener('resize', () => render(current));

  renderProjects(defaultProjects);
  render(current);

  fetch('creativeprojects.json')
    .then((res) => res.json())
    .then((data) => {
      if(data.slideshow && data.slideshow.length > 0) {
        photos = data.slideshow;
      }
      if(data.projects && data.projects.length > 0) {
        renderProjects(data.projects);
      }
      render(current);
    })
    .catch(() => {});
</script>
</body>
</html>
